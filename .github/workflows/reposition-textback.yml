  function begin(){if(!started){setStarted(true);track("launch_form_started");}}
  const fields = [
    ["company","Företagsnamn *","text"],["contact","Kontaktperson *","text"],["email","E-post *","email"],["phone","Ditt telefonnummer *","tel"],
    ["businessPhone","Företagets huvudsakliga telefonnummer *","tel"],["phoneNumbers","Hur många telefonnummer ska anslutas? *","number"],["telephony","Nuvarande operatör eller telefonilösning *","text"],
