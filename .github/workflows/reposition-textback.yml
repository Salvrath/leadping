const text = (label: string, max: number) => z.string().trim().min(2, `Ange ${label}`).max(max, `${label} är för långt`);
const attribution = z.string().trim().max(200).regex(/^[A-Za-zÀ-ž0-9_. +\\-/]*$/, "Ogiltig attribution").optional().transform((v) => v || undefined);

export const leadSchema = z.object({
  company: text("företagsnamn", 160),
  contact: text("kontaktperson", 120),
  email: z.string().trim().email("Ange en giltig e-postadress").max(254),
  phone: text("ett giltigt telefonnummer", 40),
  businessPhone: text("företagets huvudsakliga telefonnummer", 40),
  phoneNumbers: z.coerce.number().int().min(1, "Ange minst ett telefonnummer").max(100),
  telephony: text("operatör eller telefonilösning", 160),
  industry: z.string().trim().max(120).optional(),
  missedCalls: z.coerce.number().int().min(0).max(10000).optional(),
  message: z.string().trim().max(2000, "Meddelandet får vara högst 2 000 tecken").optional(),
  privacy: z.literal(true, { error: "Du måste godkänna integritetspolicyn" }),
  authority: z.literal(true, { error: "Du måste bekräfta att du får företräda företaget" }),
  submissionId: z.string().uuid(),
  formStartedAt: z.coerce.number().int().positive(),
  website: z.string().max(0),
  utmSource: attribution,
  utmMedium: attribution,
  utmCampaign: attribution,
  utmContent: attribution,
  utmTerm: attribution,
  landingPath: z.string().trim().max(500).startsWith("/").optional(),
  referrer: z.string().trim().url().max(500).optional().or(z.literal("")),
});

export type Lead = z.infer<typeof leadSchema>;
''')

          Path('lib/lead-storage.ts').write_text('''import "server-only";
import type { Lead } from "./lead-schema";
import { getSupabaseAdmin, hasSupabaseConfig } from "./server/supabase";

export type StoredLead = { id: string; email: string; company: string };
export interface LeadStorage {
  save(lead: Lead): Promise<StoredLead>;
  find(id: string): Promise<StoredLead | null>;
  update(id: string, values: Record<string, unknown>): Promise<void>;
}

export function mapLeadToRow(lead: Lead) {
  const acceptedAt = new Date().toISOString();
  return {
    company: lead.company, org_number: null, contact_name: lead.contact,
    email: lead.email, phone: lead.phone, workshop_phone: lead.businessPhone,
    telephony: lead.telephony, missed_calls_per_week: lead.missedCalls ?? 0, employees: 1,
    phone_numbers: lead.phoneNumbers, industry: lead.industry || null,
    message: lead.message || null, privacy_accepted_at: acceptedAt, authority_confirmed_at: acceptedAt,
    submission_id: lead.submissionId, utm_source: lead.utmSource || null, utm_medium: lead.utmMedium || null,
    utm_campaign: lead.utmCampaign || null, utm_content: lead.utmContent || null, utm_term: lead.utmTerm || null,
    landing_path: lead.landingPath || null, referrer: lead.referrer || null,
  };
}

export function leadSaveErrorCode(error: { code?: string } | null) {
  return error?.code === "23505" ? "DUPLICATE_SUBMISSION" : "LEAD_SAVE_FAILED";
}

export const supabaseLeadStorage: LeadStorage = {
  async save(lead) {
    const { data, error } = await getSupabaseAdmin().from("pilot_leads").insert(mapLeadToRow(lead)).select("id,email,company").single();
    if (error) throw new Error(leadSaveErrorCode(error));
    if (!data) throw new Error("LEAD_SAVE_FAILED");
    return data as StoredLead;
  },
  async find(id) {
    const { data, error } = await getSupabaseAdmin().from("pilot_leads").select("id,email,company").eq("id", id).maybeSingle();
    if (error) throw new Error("LEAD_LOOKUP_FAILED");
    return data as StoredLead | null;
  },
  async update(id, values) {
    const { error } = await getSupabaseAdmin().from("pilot_leads").update(values).eq("id", id);
    if (error) throw new Error("LEAD_UPDATE_FAILED");
  },
};

const memory = new Map<string, StoredLead>();
export const developmentLeadStorage: LeadStorage = {
  async save(lead) { const row = { id: crypto.randomUUID(), email: lead.email, company: lead.company }; memory.set(row.id, row); console.info("[textback] enquiry stored", { id: row.id }); return row; },
  async find(id) { return memory.get(id) || null; },
  async update() {},
};

export function getLeadStorage(env: NodeJS.ProcessEnv = process.env): LeadStorage {
  if (hasSupabaseConfig(env)) return supabaseLeadStorage;
  if (env.NODE_ENV === "development" || env.NODE_ENV === "test") return developmentLeadStorage;
  throw new Error("PERSISTENCE_NOT_CONFIGURED");
}
''')

