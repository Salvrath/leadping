name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Run tests
        id: tests
        shell: bash
        run: |
          set +e
          npm test > /tmp/textback-test.log 2>&1
          status=$?
          cat /tmp/textback-test.log
          exit $status
      - name: Upload failing test output
        if: failure() && steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: /tmp/textback-test.log
          retention-days: 3
      - run: npm run build
      - name: Start production server
        run: |
          NEXT_PUBLIC_SITE_URL=http://127.0.0.1:3000 \
          ELKS_WEBHOOK_SECRET=ci-webhook-secret \
          HEALTHCHECK_SECRET=ci-health-secret \
          npm start > /tmp/textback-server.log 2>&1 &
          echo $! > /tmp/textback-server.pid
      - name: Wait for server
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/textback-server.log
          exit 1
      - run: npm run smoke
      - name: Print server log on failure
        if: failure()
        run: cat /tmp/textback-server.log || true
