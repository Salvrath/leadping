name: Upgrade Stripe dependency

on:
  push:
    branches:
      - fix-stripe-managed-payments

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-stripe-managed-payments
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Upgrade Stripe and API version
        run: |
          npm install stripe@18.0.0 --save-exact
          python - <<'PY'
          from pathlib import Path
          path = Path('lib/server/stripe.ts')
          text = path.read_text()
          old = 'apiVersion: "2025-02-24.acacia"'
          new = 'apiVersion: "2025-03-31.basil"'
          if old not in text:
              raise SystemExit('Expected Stripe API version was not found')
          path.write_text(text.replace(old, new))
          PY
          rm .github/workflows/upgrade-stripe.yml
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json lib/server/stripe.ts .github/workflows/upgrade-stripe.yml
          git commit -m "Upgrade Stripe for Managed Payments"
          git push origin HEAD:fix-stripe-managed-payments
